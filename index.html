:root{--ink:#333;--sw:#f6f6fb;--pw:#fff;--x:16px;--hl:"Sky Text Headline","Sky Text",system-ui,sans-serif;--tx:"Sky Text",system-ui,sans-serif;
 --ease:cubic-bezier(.62,.02,.24,1);--out:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--sw)}
body{font-family:var(--tx);color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--sw);min-height:100vh;min-height:100svh;
 display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
#pagefx{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.stage{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;
 animation:in .8s .05s var(--out) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.frame{background:var(--pw);border-radius:calc(var(--x)/2);padding:var(--x);display:flex;flex-direction:column;gap:var(--x);
 box-shadow:0 1px 2px rgba(51,51,51,.04),0 18px 40px -24px rgba(51,51,51,.18)}

/* ---- riquadro Organic Spectrum */
.sq{position:relative;aspect-ratio:1/1;border-radius:calc(var(--x)/2);overflow:hidden;isolation:isolate;container-type:inline-size;
 perspective:1100px;background:var(--sw);transform:translateZ(0)}
.scene{position:absolute;inset:0;z-index:1;color:#fff}

 transform:translate(var(--tx0),var(--ty0)) scale(var(--s0));animation:drift 28s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:translate(var(--tx1),var(--ty1)) scale(var(--s1))}}
.art{position:absolute;inset:0;z-index:2;will-change:transform}
.art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.logo{position:absolute;z-index:4;left:7.5cqw;top:7.5cqw;width:25cqw;max-width:96px}
.logo svg{display:block;width:100%;height:auto}
.txt{position:absolute;z-index:4;left:7.5cqw;right:7.5cqw;bottom:7cqw}
.num{font-family:var(--hl);font-weight:700;font-size:min(40vw,176px);font-size:47cqw;line-height:.76;letter-spacing:-.01em}
.num.cd{font-size:40cqw}
.sub{font-weight:500;font-size:min(7.6vw,32px);font-size:9cqw;line-height:1.05;margin-top:2.6cqw}
.big{font-family:var(--hl);font-weight:700;font-size:15cqw;line-height:.9}
.rise{animation:rise 1.3s var(--t-rise,1.2s) var(--out) both}
.rise2{animation:rise 1.3s calc(var(--t-rise,1.2s) + .12s) var(--out) both}
@keyframes rise{from{opacity:0;transform:translateY(5cqw)}}

/* ---- ante */
.doors{position:absolute;inset:0;z-index:6;pointer-events:none;perspective:900px}
.door{position:absolute;overflow:hidden;outline:1px solid var(--sw);background:var(--sw);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.door::after{content:"";position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none}
.face{position:absolute;top:0;bottom:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.face b{font-family:var(--hl);font-weight:700;font-size:38cqw;line-height:.8;letter-spacing:-.01em}
.face small{font-weight:500;font-size:4.6cqw;margin-top:3.2cqw;opacity:.7}
.face svg{width:9cqw;height:9cqw;margin-bottom:4cqw;opacity:.55}
.face .ring{position:absolute;inset:4.5cqw;border:1px solid rgba(51,51,51,.10);border-radius:4px}
/* split */
.d-split .door{top:-1px;bottom:-1px;width:calc(50% + 1px)}
.d-split .l{left:0;transform-origin:0 50%;box-shadow:inset -1px 0 0 rgba(51,51,51,.14);animation:dl var(--dd) var(--d0) var(--ease) forwards}
.d-split .r{right:0;transform-origin:100% 50%;animation:dr_ var(--dd) var(--d0) var(--ease) forwards}
.d-split .l .face{left:0;width:200%} .d-split .r .face{right:0;width:200%}
.d-split .door::after{animation:shade var(--dd) var(--d0) var(--ease) forwards}
@keyframes dl{0%{transform:none}12%{transform:rotateY(-4deg)}80%{opacity:1}100%{transform:rotateY(100deg);opacity:0;visibility:hidden}}
@keyframes dr_{0%{transform:none}12%{transform:rotateY(4deg)}80%{opacity:1}100%{transform:rotateY(-100deg);opacity:0;visibility:hidden}}
@keyframes shade{12%{opacity:0}70%{opacity:.09}100%{opacity:.14}}
/* lift */
.d-lift .door{inset:-1px;box-shadow:0 0 0 rgba(51,51,51,0);animation:lift var(--dd) var(--d0) var(--ease) forwards}
@keyframes lift{0%{transform:none}14%{transform:translateY(1.6%);box-shadow:0 10px 30px rgba(51,51,51,.0)}
 60%{box-shadow:0 18px 36px rgba(51,51,51,.22)}100%{transform:translateY(-106%);box-shadow:0 18px 36px rgba(51,51,51,0);visibility:hidden}}
.d-lift .face{animation:liftf var(--dd) var(--d0) var(--ease) forwards}
@keyframes liftf{40%{opacity:1}100%{opacity:.2;transform:translateY(18%)}}
/* fold */
.d-fold .door{inset:-1px;transform-origin:50% 100%;animation:fold var(--dd) var(--d0) var(--ease) forwards}
.d-fold .door::after{animation:shade var(--dd) var(--d0) var(--ease) forwards}
@keyframes fold{0%{transform:none}80%{opacity:1}100%{transform:rotateX(96deg);opacity:0;visibility:hidden}}
/* iris: lo scenario si apre a cerchio sopra l'anta */
.d-iris{z-index:0}
.d-iris .door{inset:0}
.d-iris .face{animation:irisf var(--dd) var(--d0) var(--ease) forwards}
@keyframes irisf{100%{transform:scale(.86);opacity:0}}
.iris .scene{clip-path:circle(0% at 50% 50%);animation:iris var(--dd) var(--d0) var(--ease) forwards}
@keyframes iris{12%{clip-path:circle(2% at 50% 50%)}100%{clip-path:circle(75% at 50% 50%)}}
.iris .sq::after{content:"";position:absolute;z-index:5;left:50%;top:50%;width:150%;aspect-ratio:1;border-radius:50%;
 border:1.5px solid rgba(255,255,255,.9);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;
 animation:ring var(--dd) var(--d0) var(--ease) forwards}
@keyframes ring{12%{opacity:1;transform:translate(-50%,-50%) scale(.02)}85%{opacity:.6}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

/* ---- pannello */
.panel{display:flex;flex-direction:column;gap:14px;padding:4px 8px 6px}
.glass{position:relative;border-radius:calc(var(--x)/2);padding:calc(var(--x) + 6px) calc(var(--x) + 8px) calc(var(--x) + 2px);
 background:rgba(255,255,255,.52);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
 border:1px solid rgba(255,255,255,.95);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.35),0 1px 2px rgba(51,51,51,.05),0 22px 44px -26px rgba(51,51,51,.28)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,0) 42%)}
.glass>*{position:relative}
.eye{font-weight:500;font-size:12.5px;line-height:1.2;letter-spacing:.01em;color:rgba(51,51,51,.62)}
.eye span{color:var(--ink)}
.frase{font-family:var(--hl);font-weight:700;font-size:27px;line-height:.98;letter-spacing:-.003em;text-wrap:balance}
.calcap{font-weight:500;font-size:13px;line-height:1.2}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}

const TZ="Europe/Rome", OPEN="2026-12-01", RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const T_DOOR=.55, DUR=1.55;              /* secondi: inizio e durata apertura ante */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function todayRome(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date())
 .reduce((a,x)=>(a[x.type]=x.value,a),{});return `${p.year}-${p.month}-${p.day}`;}
const dnum=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5;
function pickTheme(iso){
  const dated=THEMES.filter(t=>t.date!=="closing");
  const hit=THEMES.find(t=>t.date===iso); if(hit) return hit;
  if(iso<dated[0].date) return dated[0];
  return THEMES.find(t=>t.kind==="closing")||dated[dated.length-1];
}
/* illustrazioni: JSON compresso (deflate-raw), decompresso con DecompressionStream; se non disponibile -> nessuna illustrazione */
const ART=(async()=>{try{if(!ART_Z||typeof DecompressionStream!=="function")return {};
  const bin=Uint8Array.from(atob(ART_Z),c=>c.charCodeAt(0));
  const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  return JSON.parse(txt);}catch(e){return {};}})();

/* PRNG deterministico per tema */
function rng(seed){let h=2166136261;for(const c of String(seed))h=Math.imul(h^c.charCodeAt(0),16777619);
  return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

const FOCUS={center:[50,50],"top-left":[0,0],"top-right":[100,0],"bottom-left":[0,100],"bottom-right":[100,100]};
function focusVars(f){const [ox,oy]=FOCUS[f]||FOCUS.center, c=f==="center";
  /* zoom verso l'angolo + drift che non scopre mai i bordi (vedi ENGINE.md) */
  const dir=v=>v===0?-1:v===100?1:0, sx=dir(ox), sy=dir(oy);
  const s0=c?1.28:1.5, s1=c?1.36:1.58;
  const a=(sg,k0,k1,alt)=>sg?[sg*k0+"%",sg*k1+"%"]:[alt[0]+"%",alt[1]+"%"];
  const [tx0,tx1]=a(sx,1.5,7,[-4,4]), [ty0,ty1]=a(sy,1.5,6,[3,-3]);
  return `--ox:${ox}%;--oy:${oy}%;--s0:${s0};--s1:${s1};--tx0:${tx0};--tx1:${tx1};--ty0:${ty0};--ty1:${ty1}`;}

function strip(n){let h="";for(let i=1;i<=24;i++){const c=(i-1)%12,r=Math.floor((i-1)/12);
  const st=i<=n?`background-position:${(c/11*100).toFixed(2)}% ${r*100}%;animation-delay:${(1.5+i*.035).toFixed(2)}s`:"";
  h+=`<i class="${i<=n?"on":""}${i===n?" today":""}" style="${st}">${i}</i>`;}
  return `<div><p class="calcap">Finestra ${n} di 24</p><div class="cal" aria-hidden="true">${h}</div></div>`;}

function doorsHTML(t,label,small){
  const face=`<div class="face"><div class="ring"></div>${FLAKE}<b>${label}</b><small>${small}</small></div>`;
  if(t.door==="split") return `<div class="doors d-split" aria-hidden="true"><div class="door l">${face}</div><div class="door r">${face}</div></div>`;
  return `<div class="doors d-${t.door}" aria-hidden="true"><div class="door">${face}</div></div>`;
}
function view(t,iso){
  let main="",doorN="",doorS="",panelMid="",foot="";
  const eye=`<p class="eye in" style="--t:1.05s">Calendario dell'Avvento · <span>${esc(t.name)}</span></p>`;
  const frase=`<p class="frase in" style="--t:1.2s">${esc(t.copySample)}</p>`;
  if(t.kind==="day"){
    main=`<p class="num rise">${t.day}</p><p class="sub rise2">dicembre</p>`;
    doorN=t.day; doorS="dicembre";
    panelMid=`<div class="in" style="--t:1.35s">${strip(t.day)}</div>`;
    foot=`<p class="foot in" style="--t:1.5s">${t.day<24?"Torna domani per aprire la prossima finestra.":"Il calendario si chiude qui. Buone feste da tutti noi."}</p>`;
  }else if(t.kind==="countdown"){
    const g=Math.max(1,Math.round(dnum(OPEN)-dnum(iso)));
    main=`<p class="num cd rise">${g}</p><p class="sub rise2">${g===1?"giorno all'apertura":"giorni all'apertura"}</p>`;
    doorN=g; doorS=g===1?"giorno":"giorni";
    foot=`<p class="foot in" style="--t:1.4s">Si apre il 1° dicembre.</p>`;
  }else{
    main=`<p class="big rise">Buone feste.</p>`;
    doorN="25"; doorS="dicembre";
    foot=`<img class="wbib in" style="--t:1.45s" src="${WBIB}" alt="Sky. We Believe in Better.">`;
  }
  const panelInner=`${eye}${frase}${panelMid}${foot}`;
  const sq=`<div class="sq" style="${focusVars(t.bgFocus)}">
    ${t.door==="iris"?doorsHTML(t,doorN,doorS):""}
    <div class="scene"><div class="bgw"><div class="bg"></div></div><div class="art" aria-hidden="true"></div><canvas class="fx"></canvas>
      <div class="logo">${LOGO}</div><div class="txt">${main}</div></div>
    ${t.door!=="iris"?doorsHTML(t,doorN,doorS):""}</div>`;
  return t.glass
    ? `<div class="frame">${sq}</div><section class="glass panel">${panelInner}</section>`
    : `<div class="frame">${sq}<section class="panel">${panelInner}</section></div>`;
}

/* ---------- animazione illustrazione */
const GEO="path,line,polyline,polygon,circle,ellipse,rect";
function animateArt(svg,seed,t0){
  const r=rng(seed), now=performance.now()/1000-t0;  /* secondi già trascorsi dal render */
  const drStart=T_DOOR+DUR*.45;
  let k=0;
  svg.querySelectorAll(".dr").forEach(el=>{
    const list=el.matches(GEO)?[el]:[...el.querySelectorAll(GEO)];
    list.forEach(g=>{ if(!g.getAttribute("pathLength")) g.setAttribute("pathLength","1");
      if(RM) return;
      const d=Math.max(0,drStart+k*.12-now); k++;
      g.style.strokeDasharray="1 1"; g.style.strokeDashoffset="1";
      g.style.animation=`drw ${(1.6+r()*.8).toFixed(2)}s ${d.toFixed(2)}s cubic-bezier(.45,0,.2,1) forwards`;});
  });
  if(RM) return;
  svg.querySelectorAll(".tw,.sw,.fl,.rot").forEach(el=>{
    const a=[], cs=el.style, hasO=!!(cs.transformOrigin||el.getAttribute("transform-origin"));
    if(el.classList.contains("tw")){
      const o=parseFloat(el.getAttribute("opacity")??cs.opacity??1); el.style.setProperty("--o",isNaN(o)?1:o);
      a.push(`tw ${(2.4+r()*2.6).toFixed(2)}s ${(-r()*5).toFixed(2)}s ease-in-out infinite`);}
    if(el.classList.contains("sw")){
      if(!hasO){cs.transformBox="fill-box";cs.transformOrigin="50% 0";}
      a.push(`sw ${(4.6+r()*2.4).toFixed(2)}s ${(-r()*6).toFixed(2)}s ease-in-out infinite alternate`);}
    if(el.classList.contains("fl"))
      a.push(`fl ${(5.5+r()*3).toFixed(2)}s ${(-r()*8).toFixed(2)}s ease-in-out infinite alternate`);
    if(el.classList.contains("rot")){
      if(!hasO){cs.transformBox="fill-box";cs.transformOrigin="50% 50%";}
      a.push(`rot ${(70+r()*40).toFixed(1)}s ${(-r()*60).toFixed(1)}s linear infinite${r()<.5?" reverse":""}`);}
    if(el.style.animation) a.unshift(el.style.animation);
    el.style.animation=a.join(",");
  });
}
const ART_CSS=`@keyframes drw{to{stroke-dashoffset:0}}
@keyframes tw{0%,100%{opacity:var(--o,1)}50%{opacity:calc(var(--o,1)*.28)}}
@keyframes sw{from{rotate:-3deg}to{rotate:3deg}}
@keyframes fl{from{translate:0 -5px}to{translate:0 6px}}
@keyframes rot{to{rotate:360deg}}`;
document.head.insertAdjacentHTML("beforeend",`<style>${ART_CSS}</style>`);

/* ---------- particelle */
function sprite(r,soft,col){const c=document.createElement("canvas"),s=Math.ceil(r*2);c.width=c.height=s;const x=c.getContext("2d");
  const g=x.createRadialGradient(r,r,0,r,r,r);g.addColorStop(0,col);g.addColorStop(soft,col.replace(/[\d.]+\)$/,"0.55)"));g.addColorStop(1,col.replace(/[\d.]+\)$/,"0)"));
  x.fillStyle=g;x.fillRect(0,0,s,s);return c;}
const DOT=sprite(16,.35,"rgba(255,255,255,1)"), BOKEH=sprite(64,.62,"rgba(255,255,255,1)"), EMBER=sprite(16,.3,"rgba(255,246,230,1)");
function flakePath(ctx,r){for(let k=0;k<6;k++){const a=k*Math.PI/3,c=Math.cos(a),s=Math.sin(a);ctx.moveTo(0,0);ctx.lineTo(c*r,s*r);
  const bx=c*r*.55,by=s*r*.55;for(const d of[-.8,.8]){const b=a+d;ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(b)*r*.3,by+Math.sin(b)*r*.3);}}}
function star4(ctx,r){ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(0,0,r,0);ctx.quadraticCurveTo(0,0,0,r);ctx.quadraticCurveTo(0,0,-r,0);ctx.quadraticCurveTo(0,0,0,-r);ctx.fill();}

const PRESETS={
 snow:{n:46,make(p,W,H,R,init){p.x=R()*W;p.y=init?R()*H:-6;p.r=.7+R()*2.1;p.v=10+p.r*7+R()*6;p.a=.35+R()*.55;p.ph=R()*6.3;},
   step(p,dt,W,H,R){p.y+=p.v*dt;p.ph+=dt*.6;if(p.y>H+6)this.make(p,W,H,R,false);},
   draw(c,p){const x=p.x+Math.sin(p.ph)*8,s=p.r*2.6;c.globalAlpha=p.a;c.drawImage(DOT,x-s,p.y-s,s*2,s*2);}},
 flakes:{n:22,make(p,W,H,R,init){p.x=R()*W;p.y=init?R()*H:-12;p.r=3+R()*5;p.v=7+R()*10;p.a=.45+R()*.45;p.ph=R()*6.3;p.rot=R()*6.3;p.vr=(R()-.5)*.5;},
   step(p,dt,W,H,R){p.y+=p.v*dt;p.ph+=dt*.5;p.rot+=p.vr*dt;if(p.y>H+12)this.make(p,W,H,R,false);},
   draw(c,p){c.save();c.translate(p.x+Math.sin(p.ph)*10,p.y);c.rotate(p.rot);c.globalAlpha=p.a;c.strokeStyle="#fff";c.lineWidth=1.1;c.lineCap="round";c.beginPath();flakePath(c,p.r);c.stroke();c.restore();}},
 sparkle:{n:16,make(p,W,H,R){p.x=W*(.18+R()*.8);p.y=H*(R()*.92);p.r=3+R()*6;p.life=1.6+R()*2.2;p.t=-R()*3;p.rot=R()*.6;},
   step(p,dt,W,H,R){p.t+=dt;if(p.t>p.life)this.make(p,W,H,R);},
   draw(c,p){if(p.t<0)return;const k=Math.sin(Math.PI*p.t/p.life);c.save();c.translate(p.x,p.y);c.rotate(p.rot+p.t*.25);c.globalAlpha=.9*k;c.fillStyle="#fff";
     star4(c,p.r*(.5+.5*k));c.globalAlpha=.5*k;c.drawImage(DOT,-p.r*.9,-p.r*.9,p.r*1.8,p.r*1.8);c.restore();}},
 stars:{n:56,make(p,W,H,R){p.x=R()*W;p.y=R()*H*.95;p.r=.5+R()*1.5;p.a=.3+R()*.6;p.ph=R()*6.3;p.f=.6+R()*1.6;},
   step(p,dt){p.ph+=dt*p.f;},
   draw(c,p){const a=p.a*(.55+.45*Math.sin(p.ph)),s=p.r*3;c.globalAlpha=a;c.drawImage(DOT,p.x-s,p.y-s,s*2,s*2);
     if(p.r>1.6){c.globalAlpha=a*.6;c.fillStyle="#fff";c.save();c.translate(p.x,p.y);star4(c,p.r*3.2);c.restore();}},
   extra:{t:-3,init(){},step(e,dt,W,H,R){e.t+=dt;if(e.t>(e.next||7)){e.t=0;e.next=7+R()*8;e.x=W*(.45+R()*.5);e.y=H*(.04+R()*.25);e.L=0;}if(e.x!==undefined)e.L+=dt;},
     draw(c,e,W,H){if(e.x===undefined||e.L>1.1)return;const k=e.L/1.1,ease=1-Math.pow(1-k,3),d=W*.55*ease,x=e.x-d*.86,y=e.y+d*.5,tl=60*(1-k*.4);
       const g=c.createLinearGradient(x,y,x+tl*.86,y-tl*.5);g.addColorStop(0,`rgba(255,255,255,${.9*(1-k)})`);g.addColorStop(1,"rgba(255,255,255,0)");
       c.globalAlpha=1;c.strokeStyle=g;c.lineWidth=1.4;c.lineCap="round";c.beginPath();c.moveTo(x,y);c.lineTo(x+tl*.86,y-tl*.5);c.stroke();}}},
 lights:{n:18,make(p,W,H,R){p.x=R()*W;p.y=R()*H;p.r=6+R()*20;p.a=.10+R()*.22;p.ph=R()*6.3;p.vx=(R()-.5)*5;p.vy=-2-R()*5;},
   step(p,dt,W,H){p.x+=p.vx*dt;p.y+=p.vy*dt;p.ph+=dt*.7;if(p.y<-p.r)p.y=H+p.r;if(p.x<-p.r)p.x=W+p.r;if(p.x>W+p.r)p.x=-p.r;},
   draw(c,p){c.globalAlpha=p.a*(.65+.35*Math.sin(p.ph));const s=p.r;c.drawImage(BOKEH,p.x-s,p.y-s,s*2,s*2);}},
 confetti:{n:24,make(p,W,H,R,init){p.x=R()*W;p.y=init?R()*H:-10;p.w=2+R()*2;p.h=5+R()*5;p.v=14+R()*16;p.ph=R()*6.3;p.f=1.5+R()*2.5;p.rot=R()*6.3;p.vr=(R()-.5)*2;p.a=.55+R()*.4;p.s=R()<.28;},
   step(p,dt,W,H,R){p.y+=p.v*dt;p.ph+=dt*p.f;p.rot+=p.vr*dt;if(p.y>H+12)this.make(p,W,H,R,false);},
   draw(c,p){c.save();c.translate(p.x+Math.sin(p.ph*.6)*9,p.y);c.rotate(p.rot);c.globalAlpha=p.a;
     if(p.s){c.scale(1,Math.cos(p.ph)*.8+.2);c.strokeStyle="#fff";c.lineWidth=1.3;c.lineCap="round";c.beginPath();c.moveTo(-6,0);c.bezierCurveTo(-3,-4,0,4,3,0);c.bezierCurveTo(4.5,-2,6,-2,7,0);c.stroke();}
     else{c.scale(Math.cos(p.ph),1);c.fillStyle="#fff";c.fillRect(-p.w/2,-p.h/2,p.w,p.h);}c.restore();}},
 embers:{n:30,make(p,W,H,R,init){p.x=R()*W;p.y=init?R()*H:H+6;p.r=.8+R()*1.8;p.v=7+R()*12;p.a=.45+R()*.5;p.ph=R()*6.3;p.f=2+R()*4;p.H=H;},
   step(p,dt,W,H,R){p.y-=p.v*dt;p.ph+=dt;if(p.y<-6)this.make(p,W,H,R,false);},
   draw(c,p){const fade=Math.min(1,p.y/(p.H*.35)),fl=.75+.25*Math.sin(p.ph*p.f),s=p.r*3;c.globalAlpha=p.a*fade*fl;c.drawImage(EMBER,p.x+Math.sin(p.ph*.8)*6-s,p.y-s,s*2,s*2);}},
 pageflakes:{n:24,make(p,W,H,R,init){p.x=R()*W;p.y=init?R()*H:-16;p.r=5+R()*10;p.v=8+R()*12;p.a=.07+R()*.09;p.ph=R()*6.3;p.rot=R()*6.3;p.vr=(R()-.5)*.25;},
   step(p,dt,W,H,R){p.y+=p.v*dt;p.ph+=dt*.5;p.rot+=p.vr*dt;if(p.y>H+16)this.make(p,W,H,R,false);},
   draw(c,p){c.save();c.translate(p.x+Math.sin(p.ph)*14,p.y);c.rotate(p.rot);c.globalAlpha=p.a;c.strokeStyle="#333";c.lineWidth=1.3;c.lineCap="round";c.beginPath();flakePath(c,p.r);c.stroke();c.restore();}}
};
const systems=new Set();
function particles(canvas,preset,seed,extraN){
  if(RM||!canvas)return null;const P=PRESETS[preset]||PRESETS.snow, R=rng(seed), ctx=canvas.getContext("2d");
  const s={canvas,ctx,P,R,W:0,H:0,parts:[],ex:P.extra?{t:-3}:null,
    size(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);this.W=r.width;this.H=r.height;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);}};
  s.size();const n=Math.round(P.n*(extraN||1)*Math.min(1.6,Math.max(.7,s.W*s.H/(330*330))));
  for(let i=0;i<n;i++){const p={};P.make.call(P,p,s.W,s.H,R,true);s.parts.push(p);}
  systems.add(s);return s;}
let last=0, running=false;
const par={x:0,y:0,tx:0,ty:0};
function frame(t){
  if(document.hidden){running=false;return;}
  const dt=Math.min((t-(last||t))/1000,.05);last=t;
  for(const s of systems){
    if(!s.canvas.isConnected){systems.delete(s);continue;}
    const {ctx,P,W,H,R}=s;ctx.clearRect(0,0,W,H);
    for(const p of s.parts){P.step.call(P,p,dt,W,H,R);P.draw.call(P,ctx,p);}
    if(s.ex){P.extra.step(s.ex,dt,W,H,R);P.extra.draw(ctx,s.ex,W,H);}
    ctx.globalAlpha=1;
  }
  /* parallasse morbido */
  par.x+=(par.tx-par.x)*Math.min(1,dt*3);par.y+=(par.ty-par.y)*Math.min(1,dt*3);
  const art=document.querySelector(".art"),bgw=document.querySelector(".bgw");
  if(art){art.style.transform=`translate3d(${(par.x*6).toFixed(2)}px,${(par.y*6).toFixed(2)}px,0)`;
    bgw.style.transform=`translate3d(${(-par.x*3).toFixed(2)}px,${(-par.y*3).toFixed(2)}px,0)`;}
  requestAnimationFrame(frame);
}
function start(){if(RM||running)return;running=true;last=0;requestAnimationFrame(frame);}
document.addEventListener("visibilitychange",()=>{document.documentElement.classList.toggle("paused",document.hidden);if(!document.hidden)start();});
addEventListener("resize",()=>systems.forEach(s=>s.size()));
if(!RM){
  const clamp=v=>Math.max(-1,Math.min(1,v));
  let tilt=false;
  if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission!=="function")
    addEventListener("deviceorientation",e=>{if(e.gamma==null)return;tilt=true;par.tx=clamp(e.gamma/25);par.ty=clamp((e.beta-45)/25);},{passive:true});
  addEventListener("pointermove",e=>{if(tilt||e.pointerType!=="mouse")return;par.tx=clamp((e.clientX/innerWidth-.5)*2);par.ty=clamp((e.clientY/innerHeight-.5)*2);},{passive:true});
  addEventListener("scroll",()=>{if(!tilt)par.ty=clamp(scrollY/240);},{passive:true});
}

/* ---------- monta un tema */
let pageSys=null;
function mount(root,t,iso){
  const t0=performance.now()/1000;
  root.style.setProperty("--d0",T_DOOR+"s");root.style.setProperty("--dd",DUR+"s");root.style.setProperty("--t-rise",(T_DOOR+DUR*.62).toFixed(2)+"s");
  root.className="stage"+(t.door==="iris"?" iris":"");
  root.style.animation="none";void root.offsetWidth;root.style.animation="";
  root.innerHTML=view(t,iso);
  const sq=root.querySelector(".sq");
  particles(sq.querySelector("canvas.fx"),t.particles,t.date);
  if(!pageSys)pageSys=particles(document.getElementById("pagefx"),"pageflakes","page");
  ART.then(a=>{const s=a[t.date];const host=root.querySelector(".art");if(!s||!host)return;host.innerHTML=s;
    const svg=host.querySelector("svg");if(svg){svg.setAttribute("aria-hidden","true");svg.setAttribute("focusable","false");svg.setAttribute("preserveAspectRatio","xMidYMid meet");animateArt(svg,t.date,t0);}});
  start();
}

const app=document.getElementById("app");
let cur=todayRome();
mount(app,pickTheme(cur),cur);
setInterval(()=>{const d=todayRome();if(d!==cur){cur=d;mount(app,pickTheme(d),d);}},60000);
</script></body></html>
