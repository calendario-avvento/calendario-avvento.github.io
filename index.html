.spectrum{position:relative;aspect-ratio:1/1;border-radius:calc(var(--x)/2);overflow:hidden;isolation:isolate;
 background:#ff00a0;color:var(--on-spectrum);perspective:1200px;
 display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--x)*1.75)}
.spectrum>*{position:relative;z-index:2}
/* Organic Spectrum ufficiale con movimento lento (stesso principio del motore video: leggero zoom e spostamento) */
.spectrum .bg{position:absolute;inset:-7%;z-index:0;background:var(--org) center/cover no-repeat;
 animation:drift 26s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{0%{transform:scale(1) translate(0,0)}50%{transform:scale(1.06) translate(-2.5%,1.5%)}100%{transform:scale(1.09) translate(2%,-2%)}}
.spectrum canvas.snow{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
/* Finestrella dell'Avvento che si apre */
.door{position:absolute;top:0;bottom:0;width:50%;z-index:5;background:var(--sky-white);
 animation:open 1.5s .35s cubic-bezier(.55,.05,.25,1) forwards;backface-visibility:hidden}
.door.l{left:0;transform-origin:left center;box-shadow:inset -1px 0 0 rgba(51,51,51,.12)}
.door.r{right:0;transform-origin:right center}
.door.r{animation-name:openr}
.door span{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--font-headline);font-weight:700;font-size:64px;color:var(--ink)}
.door.l span{right:14px} .door.r span{left:14px}
@keyframes open{0%{transform:none;opacity:1}75%{opacity:1}100%{transform:rotateY(-108deg);opacity:0;visibility:hidden}}
@keyframes openr{0%{transform:none;opacity:1}75%{opacity:1}100%{transform:rotateY(108deg);opacity:0;visibility:hidden}}
/* Calendario: 24 finestre, quelle aperte con l'Organic Spectrum */
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:4px}
.cal i{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;border-radius:3px;font-style:normal;
 font-size:10px;font-weight:500;color:rgba(51,51,51,.45);background:var(--sky-white)}
.cal i.on{color:#fff;background-image:var(--org);background-size:1200% 200%}
.cal i.today{box-shadow:0 0 0 2px var(--pure-white),0 0 0 3.5px var(--ink)}
.calcap{font-weight:500;font-size:13px;line-height:1.2}
#pagesnow{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none}
@media (prefers-reduced-motion:reduce){.spectrum .bg{animation:none}.door{display:none}}
.static .door{display:none}
.spectrum .logo{width:84px}
.spectrum .logo svg{display:block;width:100%;height:auto}
.spectrum .eyebrow{font-weight:500;font-size:18px;line-height:1.2}
.spectrum .num{font-family:var(--font-headline);font-weight:700;font-size:min(46vw,190px);line-height:.8;letter-spacing:0;margin-top:6px}
.spectrum .mese{font-weight:500;font-size:30px;line-height:1.1;margin-top:10px}
.spectrum .count-num{font-family:var(--font-headline);font-weight:700;font-size:min(34vw,140px);line-height:.8}
.spectrum .big{font-family:var(--font-headline);font-weight:700;font-size:44px;line-height:.9}
.panel{padding:calc(var(--x)*.75) calc(var(--x)*.75) calc(var(--x)*.5);display:flex;flex-direction:column;gap:14px}
.frase{font-family:var(--font-headline);font-weight:700;font-size:28px;line-height:.95;letter-spacing:0}
.daylogo{max-width:140px;max-height:72px}
.daylogo img,.daylogo svg{max-width:100%;max-height:72px;display:block}
.foot{font-weight:300;font-size:14px;line-height:1.25}
.wbib{width:150px;align-self:center;margin:6px 0 4px}

body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{opacity:0;transform:translateY(12px);animation:in .7s .1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}

function dayLogo(l){ if(!l) return ""; return `<div class="daylogo">${l.trim().startsWith("<svg")?l:`<img src="${l}" alt="">`}</div>`; }
function calStrip(n){
  const tot=CONFIG.giorni.length; let h='';
  for(let i=1;i<=tot;i++){ const c=(i-1)%12, r=Math.floor((i-1)/12);
    const pos=`background-position:${(c/11*100).toFixed(2)}% ${r*100}%`;
    h+=`<i class="${i<=n?'on':''}${i===n?' today':''}" style="${i<=n?pos:''}">${i}</i>`; }
  return `<p class="calcap">Finestra ${n} di ${tot}</p><div class="cal" aria-hidden="true">${h}</div>`;
}
const DOORS=(t)=>`<div class="door l"><span>${t}</span></div><div class="door r"></div>`;
function htmlGiorno(n){
  const g=CONFIG.giorni[n-1], tot=CONFIG.giorni.length;
  return `<div class="spectrum"><div class="bg"></div><canvas class="snow"></canvas>${DOORS(n)}<div class="logo">${SKY_LOGO}</div>
      <div><p class="eyebrow">${CONFIG.titolo}</p><p class="num">${n}</p><p class="mese">${MESI[CONFIG.mese-1]}</p></div></div>
    <div class="panel">${dayLogo(g.logo)}<p class="frase">${g.frase}</p>
      ${calStrip(n)}<p class="foot">${n<tot?"Torna domani per aprire la prossima finestra.":"Buone feste da tutti noi."}</p></div>`;
}
function htmlPrima(manca){
  const m = manca===null?"N":manca;
  return `<div class="spectrum"><div class="bg"></div><canvas class="snow"></canvas><div class="logo">${SKY_LOGO}</div>
      <div><p class="eyebrow">${CONFIG.titolo}</p><p class="count-num">${m}</p><p class="mese">${manca===1?"giorno all'apertura":"giorni all'apertura"}</p></div></div>
    <div class="panel"><p class="frase">${CONFIG.primaInizio}</p></div>`;
}
function htmlDopo(){
  return `<div class="spectrum"><div class="bg"></div><canvas class="snow"></canvas><div class="logo">${SKY_LOGO}</div>
      <div><p class="eyebrow">${CONFIG.titolo}</p><p class="big">Buone feste.</p></div></div>
    <div class="panel"><p class="frase">${CONFIG.dopoFine}</p><img class="wbib" src="${WBIB}" alt="Sky We Believe in Better"></div>`;
}

function oggi(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.fusoOrario,year:"numeric",month:"2-digit",day:"2-digit"})
    .formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return {y:+p.year,m:+p.month,d:+p.day};
}
function render(){
  const t=oggi(), tot=CONFIG.giorni.length;
  const diff=Math.round((Date.UTC(t.y,t.m-1,t.d)-Date.UTC(CONFIG.anno,CONFIG.mese-1,1))/86400000);
  const app=document.getElementById("app");
  if(diff<0) app.innerHTML=htmlPrima(-diff);
  else if(diff>=tot) app.innerHTML=htmlDopo();
  else app.innerHTML=htmlGiorno(diff+1);
}

/* Neve lenta: fiocchi a linea sottile sul fondo pagina, puntini bianchi sullo Spectrum */
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function flakePath(ctx,r){ for(let k=0;k<6;k++){ const a=k*Math.PI/3; const c=Math.cos(a),s=Math.sin(a);
  ctx.moveTo(0,0); ctx.lineTo(c*r,s*r); const bx=c*r*.55, by=s*r*.55;
  for(const d of [-.8,.8]){ const b=a+d; ctx.moveTo(bx,by); ctx.lineTo(bx+Math.cos(b)*r*.28, by+Math.sin(b)*r*.28);} } }
function snow(canvas, opts){
  if(!canvas || RM || canvas.dataset.on) return; canvas.dataset.on=1;
  const ctx=canvas.getContext("2d"); let W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2), parts=[], last=performance.now();
  function size(){ const r=canvas.getBoundingClientRect(); W=r.width; H=r.height; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function mk(y){ return {x:Math.random()*W, y:y??Math.random()*H, r:opts.rmin+Math.random()*(opts.rmax-opts.rmin),
    v:opts.vmin+Math.random()*(opts.vmax-opts.vmin), ph:Math.random()*6.28, rot:Math.random()*6.28, vr:(Math.random()-.5)*.25, a:opts.amin+Math.random()*(opts.amax-opts.amin)}; }
  size(); parts=Array.from({length:opts.n},()=>mk());
  addEventListener("resize",size);
  function tick(t){ const dt=Math.min((t-last)/1000,.05); last=t; ctx.clearRect(0,0,W,H);
    for(const p of parts){ p.y+=p.v*dt; p.ph+=dt*.5; p.rot+=p.vr*dt; const x=p.x+Math.sin(p.ph)*opts.sway;
      if(p.y-p.r>H){ Object.assign(p,mk(-p.r*2)); }
      ctx.save(); ctx.translate(x,p.y); ctx.globalAlpha=p.a;
      if(opts.kind==="flake"){ ctx.rotate(p.rot); ctx.beginPath(); flakePath(ctx,p.r); ctx.strokeStyle=opts.color; ctx.lineWidth=1.4; ctx.lineCap="round"; ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(0,0,p.r,0,6.283); ctx.fillStyle=opts.color; ctx.fill(); }
      ctx.restore(); }
    if(!document.hidden && canvas.isConnected) requestAnimationFrame(tick); }
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && canvas.isConnected){ last=performance.now(); requestAnimationFrame(tick);} });
  requestAnimationFrame(tick);
}
function avviaNeve(){
  snow(document.getElementById("pagesnow"),{kind:"flake",n:26,rmin:5,rmax:15,vmin:9,vmax:20,sway:14,amin:.08,amax:.16,color:"#333333"});
  document.querySelectorAll(".spectrum canvas.snow").forEach(c=>snow(c,{kind:"dot",n:40,rmin:.8,rmax:2.6,vmin:8,vmax:22,sway:10,amin:.35,amax:.85,color:"#ffffff"}));
}

render(); avviaNeve();
let ultimo=JSON.stringify(oggi());
setInterval(()=>{const o=JSON.stringify(oggi());if(o!==ultimo){ultimo=o;render();}},60000);
</script></body></html>
