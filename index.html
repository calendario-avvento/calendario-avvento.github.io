*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#fff;font-family:"Sky Text"}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:#f6f6fb}
canvas{position:absolute;left:0;top:0}
.logo{position:absolute;top:56px;left:26px;width:78px}
.top{position:absolute;top:64px;right:26px;color:#333;font:500 15px "Sky Text"}
.txt{position:absolute;left:28px;right:24px;top:446px;display:flex;flex-direction:column}
.mon{position:relative;color:#333;font:400 32px "Sky Text";opacity:0;transform:translateY(8px);transition:all .8s}
.kick{position:relative;margin-top:22px;color:#333;font:500 15px "Sky Text";opacity:0;transition:all .8s .1s;transform:translateY(8px)}
.head{position:relative;margin-top:8px;color:#333;font:700 28px/1.1 "Sky Text Headline";letter-spacing:-.4px;opacity:0;transform:translateY(10px);transition:all .9s .25s}
.msg{position:relative;margin-top:12px;color:rgba(51,51,51,.7);font:400 15px "Sky Text";opacity:0;transition:all .8s .5s}
.done .mon,.done .kick,.done .head,.done .msg{opacity:1;transform:none}
#fx{clip-path:inset(104px 0 0 0)}
.bar{position:absolute;left:16px;right:16px;bottom:24px;height:84px;border-radius:42px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;
 background:linear-gradient(160deg,rgba(255,255,255,.78),rgba(255,255,255,.45) 55%,rgba(255,255,255,.62));
 backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);
 box-shadow:inset 0 1.5px 0 #fff,inset 0 0 30px rgba(255,255,255,.5),0 18px 40px rgba(60,20,110,.16)}
.p{flex:0 0 38px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#333;font:500 17px "Sky Text";background:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(60,20,110,.06)}
.p.f{color:#aaa;background:rgba(255,255,255,.3);box-shadow:none}
.p.t{flex-basis:70px;background:#333;color:#fff;font:700 22px "Sky Text Headline"}
.p.t small{font:500 11px "Sky Text";margin-top:-2px}


html,body{background:#f6f6fb}
html,body{width:100%;height:100%;overflow:hidden;margin:0}
.ph{position:absolute;left:0;top:0;transform-origin:0 0}
.mon,.kick,.head,.msg{will-change:opacity,transform}
.nt .mon,.nt .kick,.nt .head,.nt .msg{transition:none!important}
canvas{pointer-events:none}
#rot{display:none;position:fixed;inset:0;background:#f6f6fb;color:#333;font:500 17px 'Sky Text';align-items:center;justify-content:center;text-align:center;z-index:20}
@media (orientation:landscape) and (max-height:500px){#rot{display:flex}}
.bar{overflow-x:auto;overflow-y:hidden;justify-content:flex-start;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 14px}
.bar::-webkit-scrollbar{display:none}
.p{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:"Sky Text"}
.txt{top:458px}
.head{text-wrap:balance;font-size:28.5px!important;line-height:1.12!important;margin-top:10px!important}
.kick{margin-top:24px!important}
.msg{margin-top:14px!important;font-size:15.5px!important}

/* ---- capsula liquid glass ---- */
@property --fl{syntax:'<length>';inherits:false;initial-value:0px}
@property --fr{syntax:'<length>';inherits:false;initial-value:34px}
/* aura: tenue, sfuma entro il proprio box (niente bordi netti in basso/ai lati) */
#aura{position:absolute;left:0;right:0;bottom:0;height:190px;pointer-events:none;opacity:.38;
 background:radial-gradient(28% 34% at 26% 62%,rgba(255,42,127,.26),transparent 72%),radial-gradient(28% 34% at 74% 62%,rgba(61,108,255,.24),transparent 72%),radial-gradient(22% 26% at 50% 70%,rgba(255,179,0,.16),transparent 72%);filter:blur(14px)}
/* vetro: blur+saturate reale, bordo speculare in alto, ombra interna in basso */
.bargl{position:absolute;left:16px;right:16px;bottom:26px;height:80px;border-radius:40px;overflow:hidden;isolation:isolate;
 background:linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.12) 45%,rgba(255,255,255,.06) 70%,rgba(235,236,248,.20) 100%);
 backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 .5px rgba(255,255,255,.55),inset 0 -1px 0 rgba(20,22,40,.06),
  inset 0 -12px 18px -14px rgba(20,22,50,.22),0 0 0 .5px rgba(20,22,40,.07),0 10px 22px -12px rgba(30,24,70,.30),0 1px 3px rgba(30,24,70,.06)}
/* overlay sopra le pillole: rim speculare + riflesso che scorre lento */
.barwrap{position:absolute;left:16px;right:16px;bottom:26px;height:80px;border-radius:40px;pointer-events:none;z-index:2;overflow:hidden}
.barwrap::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
 background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.15) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.45) 100%);
 -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask-composite:exclude}
.barwrap::after{content:"";position:absolute;inset:0;border-radius:inherit;
 background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.20) 47%,rgba(255,255,255,.32) 50%,rgba(255,255,255,.20) 53%,transparent 62%) no-repeat;
 background-size:260% 100%;background-position:115% 0;-webkit-mask:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.15) 100%);mask:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.15) 100%);
 animation:glint 11s ease-in-out infinite alternate}
@keyframes glint{0%{background-position:115% 0}100%{background-position:-15% 0}}
.bar::before{content:"";position:sticky;left:0;flex:0 0 0}
/* pillole */
.p{flex:0 0 44px;height:56px;border-radius:28px;color:#2b2b33;font:500 17px "Sky Text";position:relative;transition:transform .2s,background .2s}
/* passati: pillola di vetro chiaro */
.p.o{background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.26) 55%,rgba(255,255,255,.34) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,1),inset 0 0 0 .5px rgba(255,255,255,.6),inset 0 -6px 10px -8px rgba(20,22,50,.18),0 0 0 .5px rgba(20,22,40,.05),0 3px 8px -4px rgba(30,24,70,.18)}
.p.o:active{transform:scale(.94)}
/* futuri: bloccati, nessuna pillola piena */
.p.f{color:rgba(43,43,51,.30);background:none;box-shadow:none;font-weight:400}
.p[aria-disabled]{cursor:default}
/* oggi: goccia di vetro grafite traslucido */
.p.t{flex-basis:76px;color:#fff;font:700 22px "Sky Text Headline";overflow:hidden;
 background:radial-gradient(120% 70% at 50% -10%,rgba(255,255,255,.30),rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(66,66,78,.80) 0%,rgba(32,32,40,.86) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.50),inset 0 0 0 .5px rgba(255,255,255,.22),inset 0 -6px 12px -6px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.12),0 8px 16px -8px rgba(20,16,50,.55),0 1px 2px rgba(20,16,50,.20);
 text-shadow:0 1px 1px rgba(0,0,0,.25)}
.p.t small{font:500 11px "Sky Text";opacity:.85}
.p:focus-visible{outline:2px solid #3d6cff;outline-offset:2px}
/* scroller: dissolvenza dei bordi solo dove c'e' altro contenuto */
.bargl .bar{position:absolute;inset:0;left:0;right:0;bottom:0;height:auto;border-radius:40px;background:none!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;gap:7px;padding:0 12px;
 transition:--fl .25s,--fr .25s;
 -webkit-mask:linear-gradient(90deg,transparent 8px,#000 calc(8px + var(--fl)),#000 calc(100% - 8px - var(--fr)),transparent calc(100% - 8px));
 mask:linear-gradient(90deg,transparent 8px,#000 calc(8px + var(--fl)),#000 calc(100% - 8px - var(--fr)),transparent calc(100% - 8px))}
@media (prefers-reduced-motion: reduce){.barwrap::after{animation:none;background-position:62% 0}.p{transition:none}.bargl .bar{transition:none}}

#toast{position:absolute;left:50%;bottom:122px;transform:translate(-50%,10px);background:#333;color:#fff;font:500 14px "Sky Text";padding:10px 16px;border-radius:20px;opacity:0;transition:all .3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.mon,.kick,.head,.msg{transition:none!important}}
/* ---- dicembre: testi dei network ---- */
.txt [hidden],#ph [hidden]{display:none!important}
/* numero: si riduce e sale dopo il reveal solo se serve spazio (classe .lift calcolata al render) */
#fx,.cmpL{transform-origin:195px var(--ly,134px);transition:transform .72s cubic-bezier(.32,.72,.16,1)}
#ph.done.lift #fx,#ph.done.lift .cmpL{transform:scale(var(--ls,1))}
.nt #fx,.nt .cmpL,.nt .dtx,.nt .tipb{transition:none!important}
.lift .mon{transition-delay:.22s!important}.lift .head{transition-delay:.36s!important}.lift .dtx{transition-delay:.5s!important}.lift .tipb,.lift .msg{transition-delay:.64s!important}
.dec .head{margin-top:16px!important;letter-spacing:-.35px;color:#26262e;text-wrap:pretty}
.dec.notitle .head{letter-spacing:-.25px;text-wrap:pretty}
.dec.stmt .head{font-family:"Sky Text";font-weight:500;letter-spacing:-.15px;color:#2a2a32}
.ig{white-space:nowrap}.ig .ii+.ii{margin-left:.1em}
/* riga "dicembre" + logo ufficiale del network a destra, proporzioni originali */
.monrow{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:50px}
.monrow .mon{flex:0 1 auto;min-width:0}
.nbadge{display:flex;align-items:center;flex:none;margin-right:2px;opacity:0;transform:translateY(8px);transition:opacity .8s .12s,transform .8s .12s}
.done .nbadge{opacity:1;transform:none}
.nt .nbadge{transition:none!important}
.lift .nbadge{transition-delay:.3s!important}
.nbl{display:block;flex:none}
@media (prefers-reduced-motion: reduce){.nbadge{transition:none!important}}
.ii{display:inline-block;height:1em;width:1em;vertical-align:-.13em}
.ti{margin-right:.3em}
.dtx{position:relative;margin-top:12px;font:400 16.5px/1.5 "Sky Text";color:#4b4b55;text-wrap:pretty;opacity:0;transform:translateY(8px);transition:opacity .8s .4s,transform .8s .4s}
.dtx .ii{vertical-align:-.15em}
.done .dtx{opacity:1;transform:none}
.dec .msg{margin-top:18px!important;font-size:14.5px!important}
/* bottone del consiglio: pillola di vetro come le finestre passate */
.tipb{position:relative;align-self:flex-start;display:flex;align-items:center;gap:10px;max-width:100%;min-height:46px;margin-top:20px;padding:10px 15px 10px 12px;border:0;border-radius:23px;
 font:500 15px/1.25 "Sky Text";color:#2b2b33;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;
 background:linear-gradient(180deg,rgba(255,255,255,.80) 0%,rgba(255,255,255,.44) 55%,rgba(255,255,255,.56) 100%);
 backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);
 box-shadow:inset 0 1px 0 #fff,inset 0 0 0 .5px rgba(255,255,255,.7),inset 0 -6px 10px -8px rgba(20,22,50,.18),0 0 0 .5px rgba(20,22,40,.07),0 6px 14px -8px rgba(30,24,70,.28),0 1px 2px rgba(30,24,70,.06);
 opacity:0;transform:translateY(8px);transition:opacity .8s .55s,transform .8s .55s}
.done .tipb{opacity:1;transform:none}
.done .tipb:active{transform:scale(.97);transition:transform .12s}
.tipb:focus-visible,#tipx:focus-visible{outline:2px solid #3d6cff;outline-offset:2px}
.tgi{width:22px;height:22px;flex:none}
.tipb span{text-wrap:balance}
.brk .t1::after{content:"\A";white-space:pre}
.tch{width:12px;height:12px;flex:none;margin-left:1px;opacity:.5}
/* testo troppo lungo: la zona scorre con dissolvenze ai bordi */
.scr .txt{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:6px;
 -webkit-mask:linear-gradient(180deg,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,24px)),transparent 100%);mask:linear-gradient(180deg,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,24px)),transparent 100%)}
.scr .txt::-webkit-scrollbar{display:none}
/* pannello del consiglio: vetro liquido, sopra la capsula */
#tipsc{position:absolute;inset:0;z-index:30;background:linear-gradient(180deg,rgba(236,236,246,.30),rgba(214,214,232,.42));backdrop-filter:blur(3.5px) saturate(120%);-webkit-backdrop-filter:blur(3.5px) saturate(120%);opacity:0;transition:opacity .3s ease}
.tipon #tipsc{opacity:1}
#tip{position:absolute;left:14px;right:14px;bottom:120px;z-index:31;opacity:0;transform:translateY(16px) scale(.965);transform-origin:50% 100%;transition:opacity .26s ease,transform .5s cubic-bezier(.28,1.18,.42,1)}
.tipon #tip{opacity:1;transform:none}
#tip:focus{outline:none}
.tipg{position:relative;border-radius:34px;padding:24px 24px 26px;isolation:isolate;overflow:hidden;
 background:linear-gradient(180deg,rgba(255,255,255,.84) 0%,rgba(255,255,255,.60) 50%,rgba(246,246,252,.70) 100%);
 backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
 box-shadow:inset 0 1px 0 #fff,inset 0 0 0 .5px rgba(255,255,255,.6),inset 0 -14px 22px -18px rgba(20,22,50,.22),0 0 0 .5px rgba(20,22,40,.08),0 26px 50px -22px rgba(30,24,70,.40),0 2px 6px rgba(30,24,70,.06)}
.tipg::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.2) 40%,rgba(255,255,255,0) 62%,rgba(255,255,255,.5) 100%);
 -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask-composite:exclude}
.tipg::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55;
 background:radial-gradient(60% 50% at 12% 0%,rgba(255,42,127,.10),transparent 70%),radial-gradient(60% 50% at 95% 10%,rgba(61,108,255,.09),transparent 70%)}
.tiphd{display:flex;align-items:center;gap:11px;padding-right:46px;min-height:36px}
.tiphd img{width:28px;height:28px;flex:none}
.tiphd h2{font:700 18.5px/1.22 "Sky Text Headline";letter-spacing:-.2px;color:#26262e;text-wrap:balance}
#tipt{margin-top:14px;font:400 16.5px/1.52 "Sky Text";color:#3e3e48;text-wrap:pretty}
#tipx{position:absolute;top:16px;right:16px;width:38px;height:38px;border:0;border-radius:19px;display:grid;place-items:center;color:#2b2b33;cursor:pointer;-webkit-tap-highlight-color:transparent;
 background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.5));box-shadow:inset 0 1px 0 #fff,0 0 0 .5px rgba(20,22,40,.08),0 3px 8px -4px rgba(30,24,70,.22)}
#tipx::before{content:"";position:absolute;inset:-4px}
#tipx svg{width:14px;height:14px}
@media (prefers-reduced-motion: reduce){#fx,.cmpL,.dtx,.tipb,#tip,#tipsc{transition:none!important}#tip{transform:none}}
.pv{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;overflow-x:auto;padding:6px;background:rgba(255,255,255,.95);border-top:1px solid #ddd;z-index:9;font:500 12px "Sky Text"}
.pv a{flex:0 0 auto;padding:6px 8px;border-radius:10px;background:#eee;color:#333;text-decoration:none}.pv a.on{background:#333;color:#fff}

 requestAnimationFrame(()=>{const B=[];
 const RB=digs.length==1?13.5:12.5;const pickR=()=>RB*[.95,1,1.05][(R01()*3)|0];
 const pickK=()=>{const u=R01();return u<.42?'m':u<.82?'g':'s'};
 segs.forEach((s,si)=>{const L=polyLen(s),T=L[L.length-1];let r=pickR(),d=r*.7,j=0;
  const at=dd=>{while(j<s.length-1&&L[j+1]<dd)j++;const k=(dd-L[j])/((L[j+1]-L[j])||1);return{x:s[j].x+(s[j+1].x-s[j].x)*Math.min(1,k),y:s[j].y+(s[j+1].y-s[j].y)*Math.min(1,k)}};

 keep.forEach((b,i)=>{b.i=i;b.t0=T0+(i/N)*TW+rnd(-40,40);b.Lf=b.y-TOPY;b.sw=(rnd(.6,1)*(R01()<.5?-1:1))*Math.min(.32,26/b.Lf);b.ph=rnd(0,6.28);

   X.save();X.translate(s.x,s.y);X.rotate(s.rot);X.globalAlpha=k;X.translate(-b.r*.44,-b.r*.46);X.rotate(a/900);X.drawImage(GL,-z,-z,2*z,2*z);X.restore()}X.globalAlpha=1;
 },1e9);

 });
};

try{/* Sfondo "ad-palline-raffinate" (Art Director, versione raffinata di "palline-di-vetro").

/* Sfondo "palline-di-vetro": quattro palline di Natale in vetro trasparente soffiato pendono da fili sottili
   fuori schermo, nei soli spazi liberi (vano dell'header tra logo e testo, margini ai lati del numero).
   - Il vetro non ha colore proprio: bordo fresnel freddo, finestra di casa riflessa (luce da sinistra in alto),
     ambiente capovolto all'interno (riflesso oro/blu della pagina), mezzaluna rifratta in basso.
   - Sulla parete ogni pallina proietta l'ombra tipica del vetro: alone tenue + punto caustico dorato,

     giorno una spinta a onda; tocco/trascinamento le fa dondolare; inclinazione se disponibile senza permessi.

  {ax:376,L:706,r:17, soft:.06,a:.97,ph:4.4},   /* filo lungo a filo del bordo destro, nel vuoto tra sottotitolo e capsula */
  {ax:16, L:716,r:10, soft:.42,a:.72,ph:1.1}];  /* piccola fuori fuoco in basso a sinistra: profondità di campo */

 let cv,x,dpr,raf=0,last=0,tPrev=0,running=false,warm=1,obs=null,wasDone=false;

 /* ---------- util ---------- */
 const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};

  h.imageSmoothingQuality='high';h.drawImage(s,0,0,o.width,o.height);return o}

 /* ---------- sprite: sfera di vetro (simmetrica, la luce resta fissa mentre dondola) ---------- */

function decLayout(p){const d=p.kind==='day'?DEC[p.date]:null;const tx=$('txt'),hd=$('head'),bd=$('dtx'),tb=$('tipb');
 closeTip(true);ph.classList.add('nt');try{decFill(p,d,tx,hd,bd,tb)}finally{void ph.offsetWidth;ph.classList.remove('nt')}}
function decFill(p,d,tx,hd,bd,tb){ph.classList.remove('lift','dec','notitle','scr','stmt','brk');tx.style.top='';tx.style.height='';tx.scrollTop=0;hd.style.removeProperty('font-size');hd.style.removeProperty('line-height');window.__TXT0=440;
 const nb=$('nb');$('kick').hidden=!!d;bd.hidden=!d||!d.body;tb.hidden=!d||!d.tipLabel;$('msg').hidden=!!(d&&d.tipLabel);nb.hidden=!d;
 if(!d){bd.innerHTML='';nb.innerHTML='';return}
 ph.classList.add('dec');if(!d.hasTitle)ph.classList.add('notitle');
 nb.innerHTML=d.badge.replace(/LG:(\w+)/,(m,n)=>LG[n]);nb.title=d.net;hd.innerHTML=d.head;bd.innerHTML=d.body;
 if(d.tipLabel){$('tipl').innerHTML=d.tipLabel;$('tiph').innerHTML=d.tipLabel;$('tipt').innerHTML=d.tipText}
 /* titolo: la misura piu' grande che sta in <=2 righe (titolo) o <=5 righe (frase come titolo) */
 /* titolo: la misura piu' grande che sta in 2 righe; frase-come-titolo: Headline fino a 4 righe, altrimenti stile "statement" (Sky Text Medium) */
 const steps=d.hasTitle?[[26,1.14,2],[25,1.14,2],[24,1.14,2],[23,1.14,9]]:[[26,1.2,4],[25,1.2,4],[24,1.2,4],[23,1.2,4],[22,1.22,4],['m',21,1.38,6],['m',20,1.38,6],['m',19,1.4,9]];
 for(const st of steps){const m=st[0]==='m';const [z,lh,mx]=m?st.slice(1):st;ph.classList.toggle('stmt',m);hd.style.setProperty('font-size',z+'px','important');hd.style.setProperty('line-height',String(lh),'important');if(Math.round(hd.offsetHeight/(z*lh))<=mx)break}
 ph.classList.remove('brk');if(d.hasTitle&&hd.querySelector('.t1')){const z=parseFloat(hd.style.fontSize),one=hd.offsetHeight;if(Math.round(one/(z*1.14))===2){ph.classList.add('brk');if(Math.round(hd.offsetHeight/(z*1.14))!==2)ph.classList.remove('brk')}}
 /* spazio: il blocco parte a 458 e deve finire entro BOT; se non basta, dopo il reveal il numero si riduce e sale */
 const TOP0=458,BOT=714,H=tx.scrollHeight,gh=200*sc;let L=Math.max(0,H-(BOT-TOP0));if(L>0)L=Math.ceil(L+10);
 const LMAX=Math.round(gh*.46);let scroll=false;if(L>LMAX){L=LMAX;scroll=true}
 if(L>0){ph.classList.add('lift');ph.style.setProperty('--ls',((gh-L)/gh).toFixed(4));ph.style.setProperty('--ly',oy+'px');tx.style.top=(TOP0-L)+'px';window.__TXT0=440-L}
 if(scroll){ph.classList.add('scr');tx.style.height=(BOT-(TOP0-L))+'px';requestAnimationFrame(txFade)}}
function txFade(){const t=$('txt');const m=t.scrollHeight-t.clientHeight;t.style.setProperty('--ft',t.scrollTop>2?'24px':'0px');t.style.setProperty('--fb',t.scrollTop<m-2?'24px':'0px')}
$('txt').addEventListener('scroll',txFade,{passive:true});
let TIPOPEN=false,TIPT;
function openTip(){if(TIPOPEN)return;TIPOPEN=true;clearTimeout(TIPT);const t=$('tip');t.hidden=false;$('tipsc').hidden=false;$('tipb').setAttribute('aria-expanded','true');
 ['txt','bargl'].forEach(i=>$(i).inert=true);void t.offsetWidth;ph.classList.add('tipon');t.focus({preventScroll:true})}
function closeTip(silent){if(!TIPOPEN)return;TIPOPEN=false;ph.classList.remove('tipon');$('tipb').setAttribute('aria-expanded','false');['txt','bargl'].forEach(i=>$(i).inert=false);
 const fin=()=>{if(!TIPOPEN){$('tip').hidden=true;$('tipsc').hidden=true}};if(silent||RM)fin();else TIPT=setTimeout(fin,340);if(!silent)$('tipb').focus({preventScroll:true})}
$('tipb').addEventListener('click',openTip);$('tipx').addEventListener('click',()=>closeTip());$('tipsc').addEventListener('click',()=>closeTip());
addEventListener('keydown',e=>{if(!TIPOPEN)return;if(e.key==='Escape'){e.preventDefault();closeTip()}else if(e.key==='Tab'){e.preventDefault();$('tipx').focus()}});
function bar(){let h='';for(let i=1;i<=24;i++){const lk=i>openedUpTo;const cur=CUR.kind==='day'&&CUR.number===i;const dis=lk&&!PREVIEW&&!cur;h+=`<button class="p ${cur?'t':lk?'f':'o'}" data-d="${i}" ${cur?'aria-current="date"':''} ${dis?'aria-disabled="true"':''} aria-label="${i} dicembre${cur?', oggi':dis?', non ancora aperta':''}">${i}${cur?'<small>dic</small>':''}</button>`}
 const b=$('bar');b.innerHTML=h;const c=b.querySelector('.t')||b.querySelector(`[data-d="${Math.max(1,openedUpTo)}"]`)||b.firstChild;requestAnimationFrame(()=>{b.style.scrollBehavior='auto';b.scrollLeft=c.offsetLeft-b.clientWidth/2+c.clientWidth/2;b.style.scrollBehavior='';barFade()})}
function barFade(){const b=$('bar');const m=b.scrollWidth-b.clientWidth;b.style.setProperty('--fl',b.scrollLeft>2?'34px':'0px');b.style.setProperty('--fr',b.scrollLeft<m-2?'34px':'0px')}
$('bar').addEventListener('scroll',barFade,{passive:true});addEventListener('resize',barFade);
$('bar').addEventListener('click',e=>{const el=e.target.closest('.p');if(!el)return;const d=+el.dataset.d;if(d>openedUpTo&&!PREVIEW){toast(`Si apre il ${d} dicembre.`);el.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:260});return}
 const key=`2026-12-${String(d).padStart(2,'0')}`;render(CUR&&CUR.date===key?CUR:BYDATE[key]);const nb=$('bar').querySelector(`[data-d="${d}"]`);nb&&nb.focus({preventScroll:true})});
let TT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('on'),1800)}

function fit(){const vv=window.visualViewport;const W=vv?vv.width:innerWidth,H=(vv?vv.height:innerHeight)-(PREVIEW?44:0);const s=Math.min(W/390,H/844);const x=(W-390*s)/2,y=Math.max(0,(H-844*s)/2);ph.style.transform=`translate(${x}px,${y}px) scale(${s})`}addEventListener('resize',fit);window.visualViewport&&visualViewport.addEventListener('resize',fit);fit();
setInterval(()=>{if(!PREVIEW&&romeToday()!==TODAY)location.reload()},60000);
$('bar').addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){$('bar').scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
Promise.all([document.fonts.load('700 300px "Sky Text Headline"','0123456789'),document.fonts.load('400 16px "Sky Text"'),document.fonts.load('500 16px "Sky Text"'),document.fonts.ready]).then(()=>render(TP));
